<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Metallic Sheen Gradient -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="45%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="55%" stop-color="rgba(255,255,255,0)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.25)" />
    </linearGradient>

    <!-- Inner Glow/Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Gold Gradient -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="8" stroke-opacity="0.8" filter="url(#dropShadow)" />

  <!-- Inner Subtle Border -->
  <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="#FDE68A" stroke-width="4" stroke-opacity="0.6" />

  <!-- Deep 3D Shadow for 'B' -->
  <text x="256" y="372"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="340"
        text-anchor="middle"
        fill="#451A03"
        opacity="0.6">B</text>

  <!-- Main 'B' Lettermark in Rich Dark Coffee / Gold Accent -->
  <text x="256" y="364"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="340"
        text-anchor="middle"
        fill="#080D1A">B</text>

  <!-- Golden Inset Glow on the 'B' -->
  <text x="256" y="364"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="340"
        text-anchor="middle"
        fill="none"
        stroke="#FDE68A"
        stroke-width="6"
        stroke-opacity="0.5">B</text>

  <!-- Domino Dots Accents inside the 'B' Counters (Luxury Touch) -->
  <circle cx="258" cy="202" r="15" fill="#F59E0B" />
  <circle cx="258" cy="304" r="15" fill="#F59E0B" />
</svg>
